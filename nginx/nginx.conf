events {}

http {
   # Tăng giới hạn kích thước file upload lên 100MB
  client_max_body_size 100M;
    
    # Tăng timeout cho upload file lớn
  client_body_timeout 300s;
  
  log_format custom '$remote_addr - $upstream_addr [$time_local] "$request" $status';
    access_log /var/log/nginx/access.log custom;

  upstream music_player_backend {
    server app1:3000;
    server app2:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://music_player_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
